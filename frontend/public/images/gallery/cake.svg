  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="343" cy="367" r="193" fill="url(#glow)"/>
  <circle cx="691" cy="421" r="111" fill="url(#glow)"/>
  <rect y="640" width="1200" height="160" fill="#7c2d12" opacity="0.35"/>
  <text x="600" y="700" fill="#ffffff" text-anchor="middle"
