<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Keynote Stage">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bfdbfe" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#bfdbfe" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="569" cy="261" r="229" fill="url(#glow)"/>
  <circle cx="833" cy="543" r="143" fill="url(#glow)"/>
  <rect y="640" width="1200" height="160" fill="#172554" opacity="0.35"/>
  <text x="600" y="700" fill="#ffffff" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700">Keynote Stage</text>
  <text x="600" y="752" fill="#bfdbfe" text-anchor="middle"
