# Netlify configuration for the React frontend
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/
#
# How to deploy the frontend to Netlify:
#   1. Push this repo to GitHub.
#   2. Go to https://app.netlify.com → Add new site → Import an existing project.
#   3. Connect your GitHub repo.
#   4. Netlify will auto-detect these settings.
#   5. In Site Settings → Environment Variables, add:
#        VITE_API_BASE_URL = https://event-management-moui.onrender.com

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

# ── SPA routing: send all paths to index.html ──────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
